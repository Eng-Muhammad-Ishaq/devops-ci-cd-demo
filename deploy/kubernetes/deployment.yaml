apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-platform-api
  namespace: devops-demo
  labels:
    app.kubernetes.io/name: devops-platform-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-platform-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/eng-muhammad-ishaq/devops-ci-cd-demo:latest
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: devops-platform-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
